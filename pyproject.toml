[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vde-vlm"
version = "1.0.0"
description = "Oracle VirtualBox VM control and perception toolkit for Vision-Language Models & autonomous coding agents."
authors = [{ name = "i2qq" }]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Pillow>=9.0.0",
]

[project.scripts]
vde-vlm = "vde_vlm.cli:main"
